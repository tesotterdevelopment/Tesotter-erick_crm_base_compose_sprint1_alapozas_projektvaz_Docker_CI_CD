name: Build release artifacts
on:
  push:
    tags:
      - 'forger-v*'
permissions:
  contents: write
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install . pyinstaller
      - name: Package CLI
        run: python -m PyInstaller --onefile --collect-all forger --name forger forger_entry.py
      - name: Upload executables
        uses: softprops/action-gh-release@v2
        with:
          files: dist/forger*
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
