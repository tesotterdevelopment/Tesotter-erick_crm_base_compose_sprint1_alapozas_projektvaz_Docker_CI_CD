
name: CRM CI

on:
  push:
    branches:
      - main
      - TCRM-gergo-sprint1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Maven
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tesotter_crm_erick

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tesotter_crm_erick/pom.xml

      - name: Maven tests and package
        run: mvn -B --no-transfer-progress clean verify

  frontend:
    name: Frontend · Next.js
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    name: Infrastructure · Docker Compose
    runs-on: ubuntu-latest

    env:
      MONGO_ROOT_PASSWORD: ci-only-root-password
      MONGO_APP_PASSWORD: ci-only-app-password
      SITE_ADDRESS: ':80'
      PUBLIC_BIND_IP: 127.0.0.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container images
        run: docker compose build

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Print image summary
        run: docker compose images
