
name: CRM CI

on:
  push:
    branches:
      - main
      - TCRM-gergo-sprint1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - Maven
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: tesotter_crm_erick

    env:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/tesotter_crm_erick_ci
      CRM_JWT_SECRET: ci-only-jwt-secret-32-bytes-minimum-1234567890
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tesotter_crm_erick/pom.xml

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/27017' 2>/dev/null; then
              echo "MongoDB is accepting connections"
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB startup timed out"
          exit 1

      - name: Maven tests and package
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: tesotter_crm_erick/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend - Next.js
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    name: Infrastructure - Docker Compose
    runs-on: ubuntu-latest

    env:
      MONGO_ROOT_PASSWORD: ci-only-root-password
      MONGO_APP_PASSWORD: ci-only-app-password
      CRM_JWT_SECRET: ci-only-jwt-secret-32-bytes-minimum-1234567890
      SITE_ADDRESS: ':80'
      PUBLIC_BIND_IP: 127.0.0.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container images
        run: docker compose build

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SITE_ADDRESS=":80" \
            caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Print image summary
        run: docker image ls
