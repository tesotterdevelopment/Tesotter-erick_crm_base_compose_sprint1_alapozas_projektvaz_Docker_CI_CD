spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/tesotter_crm_erick_ci}
      auto-index-creation: true

logging:
  level:
    root: WARN
    com.tesotter_crm_erick: INFO
crm:
  jwt:
    secret: ${CRM_JWT_SECRET:ci-only-jwt-secret-32-bytes-minimum-1234567890}
